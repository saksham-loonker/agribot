plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
}

def localSigningProperties = new Properties()
def localSigningPropertiesFile = rootProject.file("signing.properties")
if (localSigningPropertiesFile.isFile()) {
    localSigningPropertiesFile.withInputStream { stream ->
        localSigningProperties.load(stream)
    }
}
def signingValue = { name ->
    providers.gradleProperty(name)
            .orElse(providers.environmentVariable(name))
            .orElse(providers.provider { localSigningProperties.getProperty(name) ?: "" })
            .orNull
}

def agribotReleaseStoreFile = signingValue("AGRIBOT_RELEASE_STORE_FILE")
def agribotReleaseStorePassword = signingValue("AGRIBOT_RELEASE_STORE_PASSWORD")
def agribotReleaseKeyAlias = signingValue("AGRIBOT_RELEASE_KEY_ALIAS")
def agribotReleaseKeyPassword = signingValue("AGRIBOT_RELEASE_KEY_PASSWORD")
def hasAgribotReleaseSigning = agribotReleaseStoreFile &&
        agribotReleaseStorePassword &&
        agribotReleaseKeyAlias &&
        agribotReleaseKeyPassword

android {
    namespace "com.sakshyam.agribot"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "com.sakshyam.agribot"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            if (hasAgribotReleaseSigning) {
                storeFile rootProject.file(agribotReleaseStoreFile)
                storePassword agribotReleaseStorePassword
                keyAlias agribotReleaseKeyAlias
                keyPassword agribotReleaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (hasAgribotReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    androidResources {
        noCompress += ['tflite']
    }

    composeOptions {
        kotlinCompilerExtensionVersion rootProject.ext.composeCompilerVersion
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation project(':core')
    implementation project(':domain')
    implementation project(':data')
    implementation project(':ml')
    implementation project(':camera')
    implementation project(':design-system')
    implementation project(':feature-scan')

    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.navigation:navigation-compose:$navigationComposeVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycleVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "com.google.dagger:hilt-android:$hiltVersion"
    kapt "com.google.dagger:hilt-android-compiler:$hiltVersion"

    debugImplementation "androidx.compose.ui:ui-tooling"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.room:room-testing:$roomVersion"
    androidTestImplementation platform("androidx.compose:compose-bom:$composeBomVersion")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
