name: Android Native

on:
  push:
    paths:
      - "*.py"
      - "agribot_platform/**"
      - "deployment/**"
      - "requirements-runtime-pi.txt"
      - "dataset/**"
      - "android_model_exports/**"
      - "agribot_android_app/android/**"
      - "agribot_android_app/package.json"
      - "49_validate_android_field_export.py"
      - "tests/**"
      - "model_training/v2/**"
      - "model_training/v3/**"
      - "requirements-test.txt"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "*.py"
      - "agribot_platform/**"
      - "deployment/**"
      - "requirements-runtime-pi.txt"
      - "dataset/**"
      - "android_model_exports/**"
      - "agribot_android_app/android/**"
      - "agribot_android_app/package.json"
      - "49_validate_android_field_export.py"
      - "tests/**"
      - "model_training/v2/**"
      - "model_training/v3/**"
      - "requirements-test.txt"
      - ".github/workflows/android-native.yml"

jobs:
  training-contracts:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            model_training/v3/requirements-training-tests.txt
      - name: Install CPU training test dependencies
        run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt -r model_training/v3/requirements-training-tests.txt
      - name: Require training contracts to execute
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          unexpected = [(str(test), reason) for test, reason in result.skipped
                        if "test_field_media_stimulation" not in str(test)]
          if unexpected:
              raise SystemExit(f"Training contract checks were skipped: {unexpected}")
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY

  native-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the retired "tools" package, which
          # sdkmanager can no longer find. Install exactly what the build needs below.
          packages: ""

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify bundled model metadata JSON
        run: |
          python -m json.tool agribot_android_app/android/app/src/main/assets/model_manifest.json >/dev/null
          python -m json.tool agribot_android_app/package.json >/dev/null

      - name: Install Python test requirements
        run: python -m pip install -r requirements-test.txt

      - name: Python tests (model contract, golden set, export validator)
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Unit tests, release lint, and APKs
        working-directory: agribot_android_app/android
        run: |
          ./gradlew \
            :domain:test \
            :camera:testDebugUnitTest \
            :ml:testDebugUnitTest \
            :data:testDebugUnitTest \
            :feature-scan:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:assembleDebugAndroidTest \
            --no-daemon --max-workers=1

      - name: Verify debug APK metadata
        working-directory: agribot_android_app/android
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee apk-permissions.txt
          grep -F "package: name='com.sakshyam.agribot'" apk-badging.txt
          grep "sdkVersion:'26'" apk-badging.txt
          grep "targetSdkVersion:'35'" apk-badging.txt
          grep "native-code: 'arm64-v8a' 'x86_64'" apk-badging.txt
          grep "android.permission.CAMERA" apk-permissions.txt
          ! grep "android.permission.INTERNET" apk-permissions.txt

      - name: Verify release APK metadata
        working-directory: agribot_android_app/android
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"; fi
          test -f "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RELEASE_APK" | tee release-apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$RELEASE_APK" | tee release-apk-permissions.txt
          grep -F "package: name='com.sakshyam.agribot'" release-apk-badging.txt
          grep "sdkVersion:'26'" release-apk-badging.txt
          grep "targetSdkVersion:'35'" release-apk-badging.txt
          grep "native-code: 'arm64-v8a'" release-apk-badging.txt
          grep "android.permission.CAMERA" release-apk-permissions.txt
          ! grep "android.permission.INTERNET" release-apk-permissions.txt

      - name: Enable hardware acceleration for offline app checks
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run persistence, lifecycle, UI, export and model parity checks
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          working-directory: agribot_android_app/android
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.sakshyam.agribot.ScanPersistenceLifecycleTest,com.sakshyam.agribot.AgribotLaunchUiTest,com.sakshyam.agribot.AgribotRoomExportIntegrationTest,com.sakshyam.agribot.VerdictCardRenderTest,com.sakshyam.agribot.AgribotModelGoldenTest --no-daemon --max-workers=1

      - name: Require selected device checks to execute without skips
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("agribot_android_app/android/app/build/outputs/androidTest-results/connected")
          cases = [case for path in root.rglob("*.xml") for case in ET.parse(path).getroot().iter("testcase")]
          expected = {"ScanPersistenceLifecycleTest", "AgribotLaunchUiTest", "AgribotRoomExportIntegrationTest", "VerdictCardRenderTest", "AgribotModelGoldenTest"}
          present = {case.attrib.get("classname", "").rsplit(".", 1)[-1] for case in cases}
          assert len(cases) >= 22, f"Expected at least 22 selected checks, got {len(cases)}"
          assert expected <= present, f"Device suites missing: {expected - present}"
          assert not [case.attrib for case in cases if any(case.find(tag) is not None for tag in ("failure", "error", "skipped"))], "Device checks failed or skipped"
          print(f"All {len(cases)} selected emulator checks executed and passed")
          PY

      - name: Upload app test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agribot-app-test-evidence
          path: |
            agribot_android_app/android/app/build/outputs/androidTest-results/connected/**
            agribot_android_app/android/app/build/reports/androidTests/connected/**
            agribot_android_app/android/app/build/reports/lint-results-release.*

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agribot-field-app-debug
          path: agribot_android_app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK and verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: agribot-field-app-release
          path: |
            agribot_android_app/android/app/build/outputs/apk/release/*.apk
            agribot_android_app/android/release-apk-badging.txt
            agribot_android_app/android/release-apk-permissions.txt
