name: Android Native

on:
  push:
    paths:
      - "*.py"
      - "agribot_platform/**"
      - "deployment/**"
      - "requirements-runtime-pi.txt"
      - "dataset/**"
      - "android_model_exports/**"
      - "agribot_android_app/android/**"
      - "agribot_android_app/package.json"
      - "45_build_android_apk.py"
      - "46_prepare_android_model_bundle.py"
      - "47_android_model_benchmark.py"
      - "48_android_release_readiness.py"
      - "49_validate_android_field_export.py"
      - "tests/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "*.py"
      - "agribot_platform/**"
      - "deployment/**"
      - "requirements-runtime-pi.txt"
      - "dataset/**"
      - "android_model_exports/**"
      - "agribot_android_app/android/**"
      - "agribot_android_app/package.json"
      - "45_build_android_apk.py"
      - "46_prepare_android_model_bundle.py"
      - "47_android_model_benchmark.py"
      - "48_android_release_readiness.py"
      - "49_validate_android_field_export.py"
      - "tests/**"
      - ".github/workflows/android-native.yml"

jobs:
  native-android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify bundled model metadata JSON
        run: |
          python -m json.tool agribot_android_app/android/app/src/main/assets/model_manifest.json >/dev/null
          python -m json.tool agribot_android_app/android/app/src/main/assets/labels/labels.json >/dev/null
          python -m json.tool agribot_android_app/android/app/src/main/assets/labels/detector_labels.json >/dev/null
          python -m json.tool agribot_android_app/package.json >/dev/null

      - name: Python readiness tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Unit tests, release lint, and APKs
        working-directory: agribot_android_app/android
        run: |
          ./gradlew \
            :domain:test \
            :camera:testDebugUnitTest \
            :ml:testDebugUnitTest \
            :data:testDebugUnitTest \
            :feature-scan:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleDebug \
            :app:assembleRelease \
            --no-daemon --max-workers=1

      - name: Verify debug APK metadata
        working-directory: agribot_android_app/android
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee apk-permissions.txt
          grep -F "package: name='com.sakshyam.agribot'" apk-badging.txt
          grep "sdkVersion:'26'" apk-badging.txt
          grep "targetSdkVersion:'35'" apk-badging.txt
          grep "native-code: 'arm64-v8a'" apk-badging.txt
          grep "android.permission.CAMERA" apk-permissions.txt
          ! grep "android.permission.INTERNET" apk-permissions.txt

      - name: Verify release APK metadata
        working-directory: agribot_android_app/android
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"; fi
          test -f "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RELEASE_APK" | tee release-apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$RELEASE_APK" | tee release-apk-permissions.txt
          grep -F "package: name='com.sakshyam.agribot'" release-apk-badging.txt
          grep "sdkVersion:'26'" release-apk-badging.txt
          grep "targetSdkVersion:'35'" release-apk-badging.txt
          grep "native-code: 'arm64-v8a'" release-apk-badging.txt
          grep "android.permission.CAMERA" release-apk-permissions.txt
          ! grep "android.permission.INTERNET" release-apk-permissions.txt

      - name: Build distribution APKs and readiness report
        id: distribution
        run: |
          CLASSIFIER_MODEL="agribot_android_app/android/app/src/main/assets/models/classifier_fastcrop_float32.tflite"
          DETECTOR_MODEL="agribot_android_app/android/app/src/main/assets/models/detector_nano_256_raw_float32.tflite"
          if [[ -f "$CLASSIFIER_MODEL" && -f "$DETECTOR_MODEL" ]]; then
            echo "model_assets=true" >> "$GITHUB_OUTPUT"
            python 45_build_android_apk.py --variant debug --skip-tests
            python 45_build_android_apk.py --variant release --skip-tests
            python 48_android_release_readiness.py --require-development-ready
          else
            echo "model_assets=false" >> "$GITHUB_OUTPUT"
            python 48_android_release_readiness.py
            echo "::notice::TFLite model assets are excluded from Git; readiness report records this build as blocked."
          fi

      - name: Upload debug APK
        if: steps.distribution.outputs.model_assets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agribot-field-app-debug
          path: agribot_android_app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK and verification metadata
        if: steps.distribution.outputs.model_assets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agribot-field-app-release
          path: |
            agribot_android_app/android/app/build/outputs/apk/release/*.apk
            agribot_android_app/android/release-apk-badging.txt
            agribot_android_app/android/release-apk-permissions.txt

      - name: Upload readiness report when model assets are omitted
        if: steps.distribution.outputs.model_assets != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agribot-release-readiness-no-model-assets
          path: dist/android_release_readiness.json
